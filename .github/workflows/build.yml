name: Build & Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    name: Linux VST3
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake g++ libfreetype6-dev libx11-dev \
            libxinerama-dev libxrandr-dev libxcursor-dev libxi-dev \
            libgl-dev libasound2-dev libcurl4-openssl-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j$(nproc)

      - name: Package
        run: |
          cd build/MorphOne_artefacts/Release/VST3
          zip -r MorphOne-linux.zip MorphOne.vst3

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/MorphOne_artefacts/Release/VST3/MorphOne-linux.zip
